<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rule Intake · Doctor Knowledge Acquisition</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ink:#16232e; --ink-soft:#41525c; --paper:#eef2f1; --surface:#ffffff;
    --surface-2:#f5f7f6; --line:#d7dedb; --line-soft:#e6ebe9; --muted:#5b6b68;
    --accent:#a9792f; --accent-ink:#f5efe3; --accent-strong:#7a5720;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e8edea; --ink-soft:#b7c4c0; --paper:#101617; --surface:#161e20;
      --surface-2:#1b2426; --line:#293335; --line-soft:#222b2d; --muted:#93a29e;
      --accent:#cf9a4f; --accent-ink:#2a2112; --accent-strong:#e0b06f;
    }
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'IBM Plex Sans',sans-serif;color:var(--ink);background:var(--paper);
    height:100dvh;display:flex;flex-direction:column;overflow:hidden;font-size:15px;}
  h1{font-family:'Source Serif 4',serif;}
  .app{width:100%;max-width:720px;margin:0 auto;height:100%;display:flex;flex-direction:column;
    background:var(--surface);border-left:1px solid var(--line);border-right:1px solid var(--line);}
  header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);}
  .mark{width:38px;height:38px;border-radius:10px;background:var(--accent-ink);color:var(--accent-strong);
    display:flex;align-items:center;justify-content:center;font-family:'Source Serif 4';font-weight:600;font-size:17px;}
  header .title h1{font-size:17px;font-weight:600;}
  header .title p{font-size:12px;color:var(--muted);margin-top:2px;}
  header .spacer{flex:1;}
  .restart{font-size:12.5px;color:var(--muted);background:transparent;border:1px solid var(--line);
    padding:7px 12px;border-radius:999px;cursor:pointer;}
  .restart:hover{border-color:var(--accent);color:var(--accent-strong);}
  #chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;align-items:flex-end;gap:10px;}
  .row.bot{justify-content:flex-start;} .row.doc{justify-content:flex-end;}
  .icon{width:28px;height:28px;border-radius:50%;flex-shrink:0;background:var(--accent-ink);
    color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .row.doc .icon{display:none;}
  .bubble{max-width:min(82%,520px);padding:11px 15px;border-radius:16px;font-size:14.5px;
    line-height:1.55;word-break:break-word;white-space:pre-line;}
  .row.bot .bubble{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:4px 16px 16px 16px;}
  .row.doc .bubble{background:var(--accent);color:var(--accent-ink);border-radius:16px 16px 4px 16px;}
  .typing-dots{display:flex;gap:5px;padding:13px 16px;background:var(--surface-2);
    border:1px solid var(--line-soft);border-radius:4px 16px 16px 16px;width:fit-content;}
  .typing-dots span{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:bop 1.3s ease-in-out infinite;}
  .typing-dots span:nth-child(2){animation-delay:.16s;} .typing-dots span:nth-child(3){animation-delay:.32s;}
  @keyframes bop{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}

  .draft-card{margin-top:4px;background:var(--surface);border:1.5px solid var(--accent);
    border-radius:14px;overflow:hidden;width:100%;}
  .draft-head{padding:12px 18px;background:var(--accent-ink);border-bottom:1px solid var(--line-soft);}
  .draft-head .label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-strong);}
  .draft-head h2{font-size:18px;font-weight:600;color:var(--accent-strong);}
  .draft-body{padding:14px 18px;}
  .draft-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13px;}
  .draft-row .k{color:var(--muted);} .draft-row .v{font-family:'IBM Plex Mono';font-size:12.5px;text-align:right;}
  .symptom-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13px;}
  .symptom-item .q{flex:1;} .symptom-item .fact{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);margin-top:2px;}
  .sevtag{font-family:'IBM Plex Mono';font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;
    color:var(--ink);background:rgba(169,121,47,.25);}
  .hallmarktag{font-family:'IBM Plex Sans';font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;
    color:var(--accent-strong);background:var(--accent-ink);border:1px solid var(--accent);}
  .draft-actions{display:flex;gap:10px;padding:4px 18px 16px;}
  .btn-confirm,.btn-discard{flex:1;padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;
    cursor:pointer;font-family:inherit;border:none;}
  .btn-confirm{background:var(--accent);color:var(--accent-ink);}
  .btn-confirm:disabled{background:var(--line);color:var(--muted);}
  .btn-discard{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}

  #bar{background:var(--surface);border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:10px;align-items:center;}
  #txt{flex:1;border:1.5px solid var(--line);border-radius:22px;padding:10px 16px;font-size:14.5px;outline:none;
    resize:none;line-height:1.4;max-height:90px;font-family:inherit;background:var(--surface-2);color:var(--ink);}
  #txt:focus{border-color:var(--accent);background:var(--surface);}
  #btn{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:none;
    cursor:pointer;font-size:16px;flex-shrink:0;}
  #btn:disabled{background:var(--line);color:var(--muted);}
  .disclaimer{text-align:center;font-size:10.5px;color:var(--muted);padding:0 20px 14px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark">&#9877;</div>
    <div class="title"><h1>Rule Intake</h1><p>Doctor knowledge acquisition</p></div>
    <div class="spacer"></div>
    <button id="restart-btn" class="restart">&#8635; Restart</button>
  </header>
  <div id="chat"></div>
  <div id="bar">
    <textarea id="txt" rows="1" placeholder="Type your answer..." disabled></textarea>
    <button id="btn" disabled>&#10148;</button>
  </div>
  <div class="disclaimer">Drafts are never added to the knowledge base until you confirm them below.</div>
</div>
<script>
const chatEl = document.getElementById('chat');
const txtEl = document.getElementById('txt');
const btnEl = document.getElementById('btn');
let session = null;

function addBubble(text, role){
  const row = document.createElement('div');
  row.className = `row ${role}`;
  if (role === 'bot'){
    const icon = document.createElement('div'); icon.className = 'icon'; icon.textContent = '+';
    row.appendChild(icon);
  }
  const bub = document.createElement('div');
  bub.className = 'bubble'; bub.textContent = text;
  row.appendChild(bub);
  chatEl.appendChild(row); chatEl.scrollTop = chatEl.scrollHeight;
}

function addDraftCard(draft){
  const row = document.createElement('div');
  row.className = 'row bot';
  row.innerHTML = '<div class="icon">+</div>';
  const card = document.createElement('div');
  card.className = 'draft-card';

  const symptomsHtml = draft.symptoms.map(s => `
    <div class="symptom-item">
      <div class="q">${s.question}<div class="fact">${s.fact}</div></div>
      <div class="tags">
        ${s.hallmark ? '<span class="hallmarktag">hallmark</span>' : ''}
        <span class="sevtag">${s.severity}/5</span>
      </div>
    </div>`).join('');

  card.innerHTML = `
    <div class="draft-head">
      <div class="label">Draft &mdash; unconfirmed</div>
      <h2>${draft.name.replace(/_/g,' ')}</h2>
    </div>
    <div class="draft-body">
      <div class="draft-row"><span class="k">Category</span><span class="v">${draft.category}</span></div>
      <div class="draft-row"><span class="k">Confidence threshold</span><span class="v">${draft.threshold}%</span></div>
      ${symptomsHtml}
    </div>
    <div class="draft-actions">
      <button class="btn-confirm">Add to Knowledge Base</button>
      <button class="btn-discard">Discard draft</button>
    </div>`;
  card.querySelector('.btn-confirm').addEventListener('click', () => confirmDraft(draft, card));
  card.querySelector('.btn-discard').addEventListener('click', () => discardDraft(card));
  row.appendChild(card);
  chatEl.appendChild(row); chatEl.scrollTop = chatEl.scrollHeight;
}

async function confirmDraft(draft, card){
  const btn = card.querySelector('.btn-confirm');
  btn.disabled = true; btn.textContent = 'Adding...';
  try{
    const res = await fetch('/doctor/confirm', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({draft})});
    const data = await res.json();
    card.querySelector('.draft-actions').remove();
    addBubble(data.ok ? data.message : `Could not add this: ${data.error}`, 'bot');
    setEnabled(false);
  } catch(e){
    btn.disabled = false; btn.textContent = 'Add to Knowledge Base';
    addBubble('Something went wrong saving this. Please try again.', 'bot');
  }
}
async function discardDraft(card){
  await fetch('/doctor/discard', {method:'POST'});
  card.querySelector('.draft-actions').remove();
  addBubble('Draft discarded — nothing was added.', 'bot');
  setEnabled(false);
}

function showTyping(){
  const row = document.createElement('div'); row.className = 'row bot'; row.id = 'typing-row';
  row.innerHTML = '<div class="icon">+</div><div class="typing-dots"><span></span><span></span><span></span></div>';
  chatEl.appendChild(row); chatEl.scrollTop = chatEl.scrollHeight;
}
function hideTyping(){ const el = document.getElementById('typing-row'); if (el) el.remove(); }
function setEnabled(on){ txtEl.disabled = !on; btnEl.disabled = !on; if (on) txtEl.focus(); }

txtEl.addEventListener('input', () => {
  txtEl.style.height = 'auto'; txtEl.style.height = Math.min(txtEl.scrollHeight, 90) + 'px';
});

async function send(){
  const text = txtEl.value.trim();
  if (!text || !session) return;
  txtEl.value = ''; txtEl.style.height = 'auto';
  addBubble(text, 'doc');
  setEnabled(false); showTyping();
  try{
    const res = await fetch('/doctor/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message:text, session})});
    const data = await res.json();
    hideTyping(); session = data.session;
    addBubble(data.message, 'bot');
    if (data.draft){ addDraftCard(data.draft); } else { setEnabled(true); }
  } catch(e){
    hideTyping(); addBubble('Something went wrong. Please try again.', 'bot'); setEnabled(true);
  }
}
btnEl.addEventListener('click', send);
txtEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
document.getElementById('restart-btn').addEventListener('click', () => { chatEl.innerHTML=''; startSession(); });

async function startSession(){
  showTyping();
  try{
    const res = await fetch('/doctor/start', {method:'POST'});
    const data = await res.json();
    hideTyping(); session = data.session;
    addBubble(data.message, 'bot'); setEnabled(true);
  } catch(e){
    hideTyping(); addBubble('Could not connect to the server.', 'bot');
  }
}
startSession();
</script>
</body>
</html>
